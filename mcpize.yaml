name: linkrescue-mcp
description: Broken link detection MCP server with affiliate link awareness and AI-powered fix suggestions. Catches the silent failure other checkers miss: links that return HTTP 200 but have dropped their affiliate tracking parameters.
runtime: container
dockerfile: Dockerfile
transport: streamable-http
credentials:
  - name: LINKRESCUE_API_URL
    description: LinkRescue API endpoint (optional, for deep scans)
    required: false
